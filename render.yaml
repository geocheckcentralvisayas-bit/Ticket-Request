services:
  - type: web
    name: envis-ticket-system
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start --workspace=backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
      - key: TRUST_PROXY
        value: "1"
      - key: DB_PATH
        value: /var/data/envis.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: NOTIFICATION_EMAILS
        sync: false
      - key: FRONTEND_URL
        sync: false
    disk:
      name: envis-data
      mountPath: /var/data
      sizeGB: 1
